<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00797D" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- SEO -->
    <title>WorkStore - Fournitures de Bureau</title>
    <meta
      name="description"
      content="Papeterie, informatique et fournitures de bureau : des milliers de références au meilleur prix, livrées à Abidjan en 48 h."
    />
    <link rel="canonical" href="https://www.workstore.ci/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WorkStore" />
    <meta property="og:title" content="WorkStore - Fournitures de Bureau" />
    <meta
      property="og:description"
      content="Papeterie, informatique et fournitures de bureau : des milliers de références au meilleur prix, livrées à Abidjan en 48 h."
    />
    <meta property="og:url" content="https://www.workstore.ci/" />
    <meta property="og:image" content="https://www.workstore.ci/og-image.svg" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WorkStore - Fournitures de Bureau" />
    <meta
      name="twitter:description"
      content="Papeterie, informatique et fournitures de bureau : des milliers de références au meilleur prix, livrées à Abidjan en 48 h."
    />
    <meta name="twitter:image" content="https://www.workstore.ci/og-image.svg" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- Typographie WorkStore : Outfit (titres/boutons/prix) · Public Sans (corps/UI) · JetBrains Mono (SKU, n° commande, coupons) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Analytics (Google Analytics 4 — activé via VITE_GA_ID) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () {
        dataLayer.push(arguments);
      };
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
