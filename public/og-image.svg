<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>BureauStore - Fournitures de Bureau</title>
  <desc>Bannière de prévisualisation BureauStore : pile de feuilles et stylo sur fond bleu encre</desc>

  <!-- Fond -->
  <rect width="1200" height="630" fill="#3A5F8F"/>
  <circle cx="1050" cy="80" r="220" fill="#2F4D75" opacity="0.6"/>
  <circle cx="120" cy="560" r="260" fill="#2F4D75" opacity="0.5"/>

  <!-- Logo -->
  <g transform="translate(600,240)">
    <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#2F4D75"/>
    <g transform="translate(0,0) rotate(-9)">
      <rect x="-33" y="-43" width="66" height="86" rx="7" fill="#C7D3E3"/>
    </g>
    <g transform="translate(9,-4) rotate(5)">
      <rect x="-33" y="-43" width="66" height="86" rx="7" fill="#E9EEF5"/>
    </g>
    <g transform="translate(5,-8) rotate(-2)">
      <rect x="-33" y="-43" width="66" height="86" rx="7" fill="#FFFFFF"/>
      <line x1="-18" y1="-13" x2="18" y2="-13" stroke="#2F4D75" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#2F4D75" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
      <line x1="-18" y1="13" x2="5" y2="13" stroke="#2F4D75" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
    </g>
    <g transform="translate(9,-8) rotate(-45)">
      <rect x="43" y="-8" width="13" height="16" rx="3" fill="#2F4D75"/>
      <rect x="-54" y="-8" width="108" height="16" rx="8" fill="#F97B1C"/>
      <polygon points="-54,-8 -54,8 -76,0" fill="#C24A0C"/>
      <circle cx="-81" cy="0" r="4" fill="#2F4D75"/>
    </g>
  </g>

  <!-- Texte -->
  <text x="600" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">BureauStore</text>
  <text x="600" y="530" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#C3D5E8">Fournitures de bureau · Livraison 24/48h</text>
</svg>